import pytest

import click
from click.testing import CliRunner


def _invoke(param_type, *args):
    @click.command()
    @click.option("--n", type=param_type)
    def cli(n):
        click.echo(repr(n))

    return CliRunner().invoke(cli, list(args))


def test_on_grid_value_accepted():
    result = _invoke(click.IntRange(0, 100, step=5), "--n", "35")
    assert result.exit_code == 0
    assert result.output == "35\n"


def test_off_grid_value_rejected_with_message():
    result = _invoke(click.IntRange(0, 100, step=5), "--n", "36")
    assert result.exit_code == 2
    assert "36 is not a multiple of 5 starting from 0." in result.output


def test_grid_starts_at_min():
    t = click.IntRange(min=3, step=4)
    assert t.convert("7", None, None) == 7
    with pytest.raises(click.BadParameter):
        t.convert("8", None, None)


def test_grid_origin_is_zero_without_min():
    t = click.IntRange(max=10, step=3)
    assert t.convert("-6", None, None) == -6
    with pytest.raises(click.BadParameter, match="starting from 0"):
        t.convert("-5", None, None)


def test_open_min_is_still_the_origin():
    t = click.IntRange(0, 10, min_open=True, step=5)
    assert t.convert("5", None, None) == 5
    with pytest.raises(click.BadParameter, match="not in the range"):
        t.convert("0", None, None)


def test_range_is_checked_before_grid():
    with pytest.raises(click.BadParameter, match="not in the range"):
        click.IntRange(0, 10, step=5).convert("15", None, None)


def test_clamped_value_must_be_on_grid():
    t = click.IntRange(0, 10, step=3, clamp=True)
    assert t.convert("-4", None, None) == 0
    with pytest.raises(click.BadParameter, match="not a multiple of 3 starting from 0"):
        t.convert("11", None, None)


@pytest.mark.parametrize("bad", [0, -2])
def test_step_must_be_positive(bad):
    with pytest.raises(ValueError):
        click.IntRange(0, 10, step=bad)


def test_step_one_accepts_every_integer():
    t = click.IntRange(0, 10, step=1)
    assert [t.convert(str(v), None, None) for v in (0, 7, 10)] == [0, 7, 10]


def test_step_attribute_and_default():
    assert click.IntRange(0, 10, step=2).step == 2
    assert click.IntRange(0, 10).step is None


def test_info_dict_includes_step_only_when_set():
    assert click.IntRange(0, 10, step=2).to_info_dict()["step"] == 2
    assert "step" not in click.IntRange(0, 10).to_info_dict()


def test_repr_mentions_step():
    assert repr(click.IntRange(0, 10, step=2)) == "<IntRange 0<=x<=10 step 2>"
    assert repr(click.IntRange(0, 10, step=2, clamp=True)) == "<IntRange 0<=x<=10 clamped step 2>"
    assert repr(click.IntRange(0, 10)) == "<IntRange 0<=x<=10>"
'''
