[[tasks]]
title = "IntRange step grid"
category = "validation"
requirements = '''
# Add a `step` option to `click.IntRange`

`click.IntRange` restricts an integer to a range. Add support for restricting it further to a regular
grid of values, e.g. "a port between 8000 and 8100 in steps of 10".

## Interface

```python
click.IntRange(min=None, max=None, min_open=False, max_open=False, clamp=False, step=None)
```

`step` is a new keyword argument, `int | None`, defaulting to `None` (no grid, current behaviour).
The instance exposes it as the attribute `step`.

## Behaviour

1. **Construction.** If `step` is given and is less than 1, raise `ValueError`.
2. **Grid origin.** The grid starts at `min` when `min` is set, otherwise at `0`. This holds even
   when `min_open=True` (the origin is still `min`, although `min` itself is excluded).
3. **Order of checks.** The existing range check and clamping happen first, exactly as today. The
   grid check is then applied to the resulting value, so a value that clamping moves onto an
   off-grid bound is rejected.
4. **Rejection.** A value `v` is on the grid when `(v - origin) % step == 0`. Otherwise conversion
   fails with `click.BadParameter` (usage error, exit code 2 on the command line) and the message
   `"{value} is not a multiple of {step} starting from {origin}."`, for example
   `36 is not a multiple of 5 starting from 0.`
5. **Info dict.** `to_info_dict()` contains a `"step"` key with the step value only when `step` is
   set; without a step the dictionary is unchanged.
6. **repr.** When `step` is set, ` step {step}` is appended inside the angle brackets after the
   existing text, e.g. `<IntRange 0<=x<=10 step 2>` and `<IntRange 0<=x<=10 clamped step 2>`.
   Without a step the repr is unchanged.
'''

