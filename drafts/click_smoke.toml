replace = '''
    name = "integer range"

    def __init__(
        self,
        min: int | None = None,
        max: int | None = None,
        min_open: bool = False,
        max_open: bool = False,
        clamp: bool = False,
        step: int | None = None,
    ) -> None:
        if step is not None and step < 1:
            raise ValueError("step must be a positive integer")

        super().__init__(
            min=min, max=max, min_open=min_open, max_open=max_open, clamp=clamp
        )
        self.step = step

    def to_info_dict(self) -> NumberRangeInfoDict[int]:
        info_dict = super().to_info_dict()

        if self.step is not None:
            info_dict["step"] = self.step  # type: ignore[typeddict-unknown-key]

        return info_dict

    def convert(
        self,
        value: t.SupportsInt | t.SupportsIndex,
        param: Parameter | None,
        ctx: Context | None,
    ) -> int:
        rv = super().convert(value, param, ctx)

        if self.step is not None:
            origin = self.min if self.min is not None else 0

            if (rv - origin) % self.step != 0:
                self.fail(
                    _("{value} is not a multiple of {step} starting from {origin}.").format(
                        value=rv, step=self.step, origin=origin
                    ),
                    param,
                    ctx,
                )

        return rv

    def __repr__(self) -> str:
        if self.step is None:
            return super().__repr__()

        return f"{super().__repr__()[:-1]} step {self.step}>"

    def _clamp(self, bound: int, dir: t.Literal[1, -1], open: bool) -> int:
'''

