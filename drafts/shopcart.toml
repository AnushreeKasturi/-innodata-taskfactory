from .cart import Cart
'''

[[tasks.source_edits]]
path = "shopcart/pricing.py"
search = '''
def shipping_cents(cart: Cart) -> int:
    if cart.is_empty() or cart.subtotal_cents() >= FREE_SHIPPING_THRESHOLD_CENTS:
        return 0
    return SHIPPING_CENTS


def total_cents(cart: Cart) -> int:
    return cart.subtotal_cents() + tax_cents(cart) + shipping_cents(cart)
'''
replace = '''
class IneligibleCode(Exception):
    """Raised when a discount code cannot be applied to a cart."""

    def __init__(self, code: str, reason: str) -> None:
        super().__init__(f"{code}: {reason}")
        self.code = code
        self.reason = reason


@dataclass(frozen=True)
class DiscountCode:
    code: str
    percent: int = 0
    amount_cents: int = 0
    min_subtotal_cents: int = 0
    category: str | None = None

    def __post_init__(self) -> None:
        if not 0 <= self.percent <= 100:
            raise ValueError("percent must be between 0 and 100")
        if self.amount_cents < 0 or self.min_subtotal_cents < 0:
            raise ValueError("amounts must be non-negative")


def discount_cents(cart: Cart, code: DiscountCode) -> int:
    if cart.subtotal_cents() < code.min_subtotal_cents:
        raise IneligibleCode(code.code, "minimum subtotal not reached")
    eligible = sum(
        p.price_cents * qty
        for p, qty in cart.lines()
        if code.category is None or p.category == code.category
    )
    if eligible == 0:
        raise IneligibleCode(code.code, "no eligible items")
    off = _round_half_up(eligible * code.percent, 100) + code.amount_cents
    return min(off, eligible)


def shipping_cents(cart: Cart, discount: int = 0) -> int:
    if cart.is_empty() or cart.subtotal_cents() - discount >= FREE_SHIPPING_THRESHOLD_CENTS:
        return 0
    return SHIPPING_CENTS


def total_cents(cart: Cart, code: DiscountCode | None = None) -> int:
    discount = discount_cents(cart, code) if code is not None else 0
    return cart.subtotal_cents() - discount + tax_cents(cart) + shipping_cents(cart, discount)
'''

