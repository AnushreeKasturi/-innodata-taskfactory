'''
replace = '''
from .catalog import Catalog, Product


class QuantityLimitExceeded(ValueError):
    def __init__(self, sku: str, limit: int, requested: int) -> None:
        super().__init__(f"{sku}: limit {limit} per order, requested {requested}")
        self.sku = sku
        self.limit = limit
        self.requested = requested
'''

[[tasks.source_edits]]
path = "shopcart/cart.py"
search = '''
        self._catalog.get(sku)  # raises UnknownProduct
        self._lines[sku] = self._lines.get(sku, 0) + qty
'''
replace = '''
        product = self._catalog.get(sku)  # raises UnknownProduct
        new_qty = self._lines.get(sku, 0) + qty
        if product.max_per_order is not None and new_qty > product.max_per_order:
            raise QuantityLimitExceeded(sku, product.max_per_order, new_qty)
        self._lines[sku] = new_qty

    def remaining_allowance(self, sku: str) -> int | None:
        product = self._catalog.get(sku)
        if product.max_per_order is None:
            return None
        return product.max_per_order - self._lines.get(sku, 0)
'''

[[tasks.test_edits]]
path = "tests/test_quantity_limits.py"
search = ""
replace = '''
import pytest

from shopcart import Cart, Catalog, Product, UnknownProduct
from shopcart.cart import QuantityLimitExceeded


@pytest.fixture
def limited(catalog):
    catalog.add(Product("GPU", "Graphics card", 30000, "general", max_per_order=2))
    return catalog


def test_add_up_to_limit(limited):
    cart = Cart(limited)
    cart.add("GPU", 2)
    assert cart.quantity("GPU") == 2


def test_single_add_over_limit_rejected_and_cart_unchanged(limited):
    cart = Cart(limited)
    with pytest.raises(QuantityLimitExceeded) as exc:
        cart.add("GPU", 3)
    assert (exc.value.sku, exc.value.limit, exc.value.requested) == ("GPU", 2, 3)
    assert cart.quantity("GPU") == 0


def test_cumulative_adds_over_limit(limited):
    cart = Cart(limited)
    cart.add("GPU")
    with pytest.raises(QuantityLimitExceeded) as exc:
        cart.add("GPU", 2)
    assert exc.value.requested == 3
    assert cart.quantity("GPU") == 1


def test_limit_error_is_value_error(limited):
    with pytest.raises(ValueError):
        Cart(limited).add("GPU", 5)


def test_remove_frees_allowance(limited):
    cart = Cart(limited)
    cart.add("GPU", 2)
    cart.remove("GPU", 1)
    cart.add("GPU")
    assert cart.quantity("GPU") == 2


def test_remaining_allowance(limited):
    cart = Cart(limited)
    assert cart.remaining_allowance("GPU") == 2
    cart.add("GPU")
    assert cart.remaining_allowance("GPU") == 1
    assert cart.remaining_allowance("APL") is None
    with pytest.raises(UnknownProduct):
        cart.remaining_allowance("NOPE")


def test_unlimited_products_unaffected(limited):
    cart = Cart(limited)
    cart.add("APL", 500)
    assert cart.quantity("APL") == 500


@pytest.mark.parametrize("bad", [0, -1])
def test_catalog_rejects_invalid_limit(bad):
    with pytest.raises(ValueError):
        Catalog().add(Product("X", "x", 100, max_per_order=bad))


def test_limit_of_one():
    c = Catalog()
    c.add(Product("ONE", "one", 100, max_per_order=1))
    cart = Cart(c)
    cart.add("ONE")
    with pytest.raises(QuantityLimitExceeded):
        cart.add("ONE")
'''
