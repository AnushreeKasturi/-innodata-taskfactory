replace = '''
import pytest

from shopcart import Cart, Product
from shopcart.pricing import DiscountCode, IneligibleCode, discount_cents, shipping_cents, total_cents


def _cart(catalog, **items):
    cart = Cart(catalog)
    for sku, qty in items.items():
        cart.add(sku, qty)
    return cart


def test_percent_discount(catalog):
    cart = _cart(catalog, APL=3, BK1=1)  # subtotal 1860
    code = DiscountCode("TEN", percent=10)
    assert discount_cents(cart, code) == 186
    assert total_cents(cart, code) == 1860 - 186 + 18 + 499


def test_percent_rounds_half_up(catalog):
    cart = _cart(catalog, APL=3)  # 360
    assert discount_cents(cart, DiscountCode("P3", percent=3)) == 11  # 10.8
    assert discount_cents(cart, DiscountCode("P7", percent=7)) == 25  # 25.2


def test_percent_bounds_are_inclusive(catalog):
    cart = _cart(catalog, APL=1)
    assert discount_cents(cart, DiscountCode("ALL", percent=100)) == 120
    assert discount_cents(cart, DiscountCode("FIX", percent=0, amount_cents=20)) == 20


def test_category_restricted(catalog):
    cart = _cart(catalog, APL=3, BK1=1)
    assert discount_cents(cart, DiscountCode("BOOKS50", percent=50, category="books")) == 750


def test_fixed_amount_capped_at_eligible(catalog):
    cart = _cart(catalog, BK1=1)
    assert discount_cents(cart, DiscountCode("BIG", amount_cents=2000)) == 1500


def test_cap_applies_to_eligible_not_subtotal(catalog):
    cart = _cart(catalog, APL=1, BK1=1)
    assert discount_cents(cart, DiscountCode("F", amount_cents=500, category="food")) == 120


def test_percent_and_amount_combine(catalog):
    cart = _cart(catalog, APL=3, BK1=1)
    assert discount_cents(cart, DiscountCode("BOTH", percent=10, amount_cents=100)) == 286


def test_minimum_subtotal_boundary(catalog):
    cart = _cart(catalog, APL=3, BK1=1)  # 1860
    assert discount_cents(cart, DiscountCode("MIN", percent=10, min_subtotal_cents=1860)) == 186
    with pytest.raises(IneligibleCode) as exc:
        discount_cents(cart, DiscountCode("MIN", percent=10, min_subtotal_cents=1861))
    assert exc.value.code == "MIN"


def test_no_eligible_items(catalog):
    cart = _cart(catalog, APL=3, BK1=1)
    with pytest.raises(IneligibleCode):
        total_cents(cart, DiscountCode("GEAR", percent=10, category="general"))


def test_free_shipping_uses_discounted_subtotal(catalog):
    cart = _cart(catalog, HDP=1, BK1=1)  # 5700 - 1140 = 4560 < 5000
    assert shipping_cents(cart, 1140) == 499
    assert total_cents(cart, DiscountCode("TWENTY", percent=20)) == 5700 - 1140 + 756 + 499


def test_free_shipping_at_exact_threshold_after_discount(catalog):
    cart = _cart(catalog, HDP=1, BK1=1)  # 5700 - 700 = 5000
    assert total_cents(cart, DiscountCode("FLAT", amount_cents=700)) == 5700 - 700 + 756


def test_tax_is_on_undiscounted_prices(catalog):
    cart = _cart(catalog, HDP=1)
    assert total_cents(cart, DiscountCode("H", amount_cents=200)) == 4200 - 200 + 756 + 499


@pytest.mark.parametrize("kwargs", [{"percent": -1}, {"percent": 101}, {"amount_cents": -5}, {"min_subtotal_cents": -1}])
def test_invalid_codes(kwargs):
    with pytest.raises(ValueError):
        DiscountCode("BAD", **kwargs)


def test_no_code_unchanged(catalog):
    cart = _cart(catalog, APL=3, BK1=1)
    assert total_cents(cart) == 1860 + 18 + 499
    assert shipping_cents(cart) == 499


def test_shipping_default_discount_is_zero_at_threshold(catalog):
    catalog.add(Product("TV5", "Monitor", 5000, "general"))
    cart = _cart(catalog, TV5=1)
    assert shipping_cents(cart) == 0
'''


[[tasks]]
title = "Enforce per-order quantity limits"
category = "validation"
requirements = '''
# Per-order quantity limits

Some products may only be bought in limited quantities per order.

## `Product.max_per_order`
Add a field `max_per_order: int | None = None` to `Product` (after `category`). `None` means no limit.
`Catalog.add` raises `ValueError` if `max_per_order` is set and is less than 1.

## `QuantityLimitExceeded`
Add an exception `QuantityLimitExceeded(sku: str, limit: int, requested: int)` to `shopcart/cart.py`.
It must be a subclass of `ValueError` and store `sku`, `limit` and `requested` as attributes, where
`requested` is the total quantity the cart would have held.

## `Cart.add`
If adding would make the cart's quantity of that product exceed `max_per_order`, raise
`QuantityLimitExceeded` and leave the cart unchanged. Reaching the limit exactly is allowed.
Removing items frees up allowance again.

## `Cart.remaining_allowance(sku) -> int | None`
Returns how many more units of `sku` can be added, or `None` if the product has no limit.
Raises `UnknownProduct` for unknown SKUs.
'''

