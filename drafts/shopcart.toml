[[tasks]]
title = "Add discount codes with eligibility rules"
category = "business_rule"
requirements = '''
# Discount codes

Customers can apply a discount code to an order. Add the following to `shopcart/pricing.py`.

## `DiscountCode`
A frozen dataclass `DiscountCode(code: str, percent: int = 0, amount_cents: int = 0, min_subtotal_cents: int = 0, category: str | None = None)`.

- `percent` must be between 0 and 100 inclusive; `amount_cents` and `min_subtotal_cents` must be >= 0.
  Otherwise constructing the code raises `ValueError`.

## `IneligibleCode`
An exception `IneligibleCode(code: str, reason: str)` that stores `code` and `reason` as attributes.

## `discount_cents(cart, code) -> int`
- If the cart subtotal is below `min_subtotal_cents`, raise `IneligibleCode`. A subtotal exactly equal to the minimum is allowed.
- The *eligible amount* is the sum of line totals for products whose category equals `code.category`
  (or all lines when `category` is `None`). If the eligible amount is 0, raise `IneligibleCode`.
- The discount is `percent` of the eligible amount, rounded half up to a whole cent, plus `amount_cents`.
- The discount never exceeds the eligible amount.

## Changes to existing functions
- `shipping_cents(cart, discount: int = 0)`: shipping is free when the cart is empty or when
  `subtotal - discount` is at least `FREE_SHIPPING_THRESHOLD_CENTS`.
- `total_cents(cart, code: DiscountCode | None = None)`: `subtotal - discount + tax + shipping`, where
  tax is still computed on the undiscounted prices and shipping uses the discounted subtotal.
  Without a code the result is unchanged.
'''

[[tasks.source_edits]]
path = "shopcart/pricing.py"
search = '''
